# Aetherius Intelligence Labs — static host for the built site.
#
# Three entry points out of one `dist/`: the marketing shell at `/`, the
# privacy policy at `/privacy/` and the perimeter-node canvas app at
# `/simulator/`. None uses a client-side router, so a miss is a 404 rather
# than the wrong page.
#
# scripts/deploy.sh renders this file into the nginx config directory,
# rewriting each line that carries a trailing marker comment. The literals
# below are the Ubuntu/Debian defaults it substitutes; on a macOS dev box the
# same lines come out under the Homebrew prefix instead. Edit this file, never
# the installed copy — every deploy overwrites that one.

server {
    listen      9090;                                                # @@PORT@@
    listen      [::]:9090;                                           # @@PORT6@@
    server_name localhost;

    root        /var/www/ail-website;                                # @@ROOT@@
    index       index.html;
    charset     utf-8;

    access_log  /var/log/nginx/ail-website.access.log;               # @@ACCESS_LOG@@
    error_log   /var/log/nginx/ail-website.error.log;                # @@ERROR_LOG@@

    # Directory redirects (/simulator → /simulator/) go out relative, so the
    # non-standard port can never be dropped from the Location header.
    absolute_redirect off;

    # woff2 is already compressed; gzipping it only burns CPU.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # The contact form posts here; ail-contact.service turns the submission into
    # one email and forgets it. A prefix location outranks the `/` above, so the
    # static try_files never sees these. If the service is down this is a 502 and
    # the form says so — the rest of the site is unaffected.
    location /api/ {
        proxy_pass         http://127.0.0.1:8787;                    # @@BACKEND@@
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Sending mail can take a few seconds on a slow SMTP handshake.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # One submission is a few hundred bytes; anything larger is not the form.
        client_max_body_size  32k;

        add_header Cache-Control "no-store" always;
    }

    # Vite content-hashes everything under /assets, so it can be pinned forever.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The three HTML entry points must never be cached, or a deploy stays invisible.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Ad platforms re-review this URL after a policy edit; a cached copy would
    # show them the old text.
    location = /privacy/index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /simulator/index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Nothing dotted is ever part of a build; refuse it if one lands here.
    location ~ /\. {
        deny all;
    }
}
